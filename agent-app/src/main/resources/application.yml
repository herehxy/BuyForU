# Agent 服务配置：组合 DeepSeek 规划、Ollama Embedding、Commerce MCP、PostgreSQL 和 OIDC。
spring:
  application:
    name: buyforu-agent
  ai:
    # Chat 和 Embedding 使用不同 provider；禁止用本地规则模型替代真实规划。
    model:
      chat: openai
      embedding: ollama
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: 0
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:embeddinggemma}
        truncate: false
      init:
        pull-model-strategy: never
    mcp:
      # MCP 仅负责 Agent 到 Commerce 的传输，Tool 自动回调关闭，避免模型自行执行交易写操作。
      client:
        type: SYNC
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            commerce:
              url: ${COMMERCE_MCP_URL:http://localhost:8081}
              endpoint: /mcp
  datasource:
    # Agent 状态、记忆、checkpoint、审计和 pgvector 共用 PostgreSQL 的 agent_schema。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buyforu}
    username: ${DB_USER:buyforu}
    password: ${DB_PASSWORD:buyforu}
    hikari:
      # pgvector 装在 agent_schema，连接必须能解析 vector 类型。
      connection-init-sql: SET search_path TO agent_schema, public
      # 网络等待不持有数据库连接，因此连接池按短事务吞吐配置而非 LLM 并发配置。
      maximum-pool-size: ${AGENT_DB_MAX_POOL_SIZE:12}
      minimum-idle: ${AGENT_DB_MIN_IDLE:2}
      connection-timeout: ${AGENT_DB_CONNECTION_TIMEOUT_MS:1000}
      validation-timeout: ${AGENT_DB_VALIDATION_TIMEOUT_MS:500}
      leak-detection-threshold: ${AGENT_DB_LEAK_DETECTION_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:50ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:100ms}
  flyway:
    default-schema: agent_schema
    schemas: agent_schema
  security:
    # API 是 OAuth2 Resource Server；issuer 与下方 audience 会同时校验。
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8082/realms/buyforu}
buyforu:
  security:
    audience: ${OIDC_AUDIENCE:buyforu-api}
  mcp:
    service-token: ${COMMERCE_MCP_SERVICE_TOKEN}
  concurrency:
    instance-id: ${AGENT_INSTANCE_ID:${spring.application.name}-${random.uuid}}
    lease-duration: ${AGENT_LEASE_DURATION:30s}
    lease-heartbeat: ${AGENT_LEASE_HEARTBEAT:10s}
    planning-workers: ${AGENT_PLANNING_WORKERS:20}
    transaction-workers: ${AGENT_TRANSACTION_WORKERS:16}
    control-workers: ${AGENT_CONTROL_WORKERS:4}
    deepseek-concurrency: ${DEEPSEEK_CONCURRENCY:20}
    mcp-read-concurrency: ${MCP_READ_CONCURRENCY:32}
    mcp-write-concurrency: ${MCP_WRITE_CONCURRENCY:16}
    embedding-concurrency: ${EMBEDDING_CONCURRENCY:8}
    planning-queue-capacity: ${PLANNING_QUEUE_CAPACITY:1500}
    transaction-queue-capacity: ${TRANSACTION_QUEUE_CAPACITY:500}
    per-user-queue-capacity: ${PER_USER_QUEUE_CAPACITY:10}
    planning-user-rate-per-minute: ${PLANNING_USER_RATE_PER_MINUTE:6}
    planning-user-burst: ${PLANNING_USER_BURST:2}
    transaction-user-rate-per-minute: ${TRANSACTION_USER_RATE_PER_MINUTE:30}
    transaction-user-burst: ${TRANSACTION_USER_BURST:10}
    read-user-rate-per-minute: ${READ_USER_RATE_PER_MINUTE:120}
    read-user-burst: ${READ_USER_BURST:30}
    global-write-rate-per-second: ${GLOBAL_WRITE_RATE_PER_SECOND:100}
    global-write-burst: ${GLOBAL_WRITE_BURST:200}
server:
  port: ${PORT:8080}
management:
  # 健康探针用于编排系统，Prometheus 用于运行指标；不向匿名请求暴露敏感详情。
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
